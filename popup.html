<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Group Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>FB Scraper <span class="badge" id="countBadge">0</span></span>
      </div>
      <div class="header-actions">
        <button id="clearBtn" title="Clear All Data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="posts">Posts</button>
      <button class="tab-btn" data-tab="auto-comment">Auto Comment</button>
    </div>

    <div id="posts-tab" class="tab-content active">
      <div class="main-actions">
        <div style="display: flex; gap: 8px; flex: 1;">
          <input type="number" id="scrapeLimit" class="limit-input" placeholder="Target posts (e.g. 50)" min="1" style="width: 130px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-main); padding: 0 10px; font-size: 0.8rem;">
          <button id="scrapeBtn" class="btn-primary" style="flex: 1;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="m21 8-4-4-4 4"></path><path d="M17 4v16"></path></svg>
            <span>Start</span>
          </button>
        </div>
        <button id="exportBtn" class="btn-secondary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Export</span>
        </button>
      </div>

      <div class="filter-controls">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="filterInput" placeholder="Filter posts...">
        </div>
        <select id="sortSelect" class="sort-dropdown">
          <option value="newest">Newest</option>
          <option value="likes">Most Likes</option>
          <option value="comments">Most Comments</option>
        </select>
      </div>

      <div id="status" class="status-bar">Waiting for Facebook Group...</div>

      <div class="results-container">
        <div class="results-header">
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="selectAllPosts" style="width: 14px; height: 14px; cursor: pointer;">
            <h3>Captured Posts</h3>
          </div>
          <span id="updateTimer">Live Interception Active</span>
        </div>
        <div id="results" class="results-list">
          <div class="empty-state">
            <div class="empty-icon">📥</div>
            <p>No data captured yet. Scroll through the Facebook Group to begin.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="auto-comment-tab" class="tab-content">
      <div class="auto-comment-config">
        <h3>Auto Comment Configuration</h3>
        <div class="input-group">
          <label for="commentTemplate">Comment/Reply Message:</label>
          <textarea id="commentTemplate" placeholder="Enter your comment here..."></textarea>
        </div>
        <div class="input-group" style="flex-direction: row; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px;">
          <label for="autoReplyMode" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="autoReplyMode" style="width: 16px; height: 16px;">
            <span style="font-size: 0.8rem; font-weight: 600; color: var(--accent);">Enable Auto Reply Mode</span>
          </label>
        </div>
        <div id="keywordGroup" class="input-group" style="display: none;">
          <label for="replyKeywords">Keywords (comma separated):</label>
          <input type="text" id="replyKeywords" placeholder="e.g. spill, link, dimana, harga" style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--glass-border); border-radius: 10px; padding: 8px 12px; color: var(--text-main); font-size: 0.8rem;">
          <p style="font-size: 0.65rem; color: var(--text-muted); margin: 4px 0;">Replies to comments containing these words.</p>
        </div>
        <div class="input-group">
          <label for="commentDelay">Delay between comments (seconds):</label>
          <input type="number" id="commentDelay" value="10" min="5" max="300">
        </div>
        <div class="action-bar" style="display: flex; gap: 8px;">
          <button id="startAutoCommentBtn" class="btn-primary" style="flex: 2;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>Start Auto Comment</span>
          </button>
          <button id="stopAutoCommentBtn" class="btn-secondary" style="flex: 1; display: none; background: #ef4444; border-color: #dc2626;">
            <span>Stop</span>
          </button>
        </div>
      </div>

      <div class="results-container" style="margin-top: 15px;">
        <div class="results-header">
          <h3>Progress Status</h3>
          <span id="commentStatus">Idle</span>
        </div>
        <div id="auto-comment-log" class="results-list" style="max-height: 150px; font-size: 0.75rem; padding: 10px;">
          <div class="empty-state">
            <p>Wait for start to see progress log.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
