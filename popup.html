<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Group Scraper</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 320px; padding: 16px; font-family: 'Inter', sans-serif; }
    .container { display: flex; flex-direction: column; gap: 16px; }
    .header { text-align: center; }
    .header svg { color: var(--primary); margin-bottom: 8px; }
    .header h1 { font-size: 1.2rem; margin: 0; }
    .btn-dashboard { 
      background: var(--primary); 
      color: white; 
      padding: 12px; 
      border-radius: 8px; 
      border: none; 
      font-weight: 600; 
      cursor: pointer; 
      width: 100%;
      font-size: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-dashboard:hover { background: var(--primary-hover); }
    .scrape-section {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-scrape {
      background: var(--bg-card-hover);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-scrape:hover { background: #475569; }
    #status {
      font-size: 0.8rem;
      text-align: center;
      color: var(--text-muted);
      min-height: 20px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .footer button {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .footer button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <h1>FB Scraper Pro</h1>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Captured: <span id="countBadge" style="font-weight: 600; color: var(--primary);">0</span> posts</p>
    </div>

    <button id="openDashboardBtn" class="btn-dashboard">
      Open Dashboard 🚀
    </button>

    <div class="scrape-section">
      <p style="font-size: 0.85rem; margin: 0; text-align: center;">Buka halaman Group Facebook, lalu klik tombol di bawah untuk mulai scraping feed.</p>
      <input type="number" id="scrapeLimit" placeholder="Batas Maksimal Post (Opsional)" min="1" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-family: inherit; width: calc(100% - 22px);">
      <button id="scrapeBtn" class="btn-scrape">
        Start Scraping
      </button>
      <div id="status">Ready</div>
    </div>

    <div class="footer">
      <span>v2.0</span>
      <button id="clearBtn">Clear All Data</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
